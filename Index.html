<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Coin Sayti</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>X Coin Sayti</h1>
    </header>

    <nav class="nav">
      <ul>
        <li><a href="#game" class="nav-item"><img src="game-icon.png" alt="Game"> O'yinlar</a></li>
        <li><a href="#keys" class="nav-item"><img src="keys-icon.png" alt="Keys"> Keyslar</a></li>
        <li><a href="#uc-withdraw" class="nav-item"><img src="uc-icon.png" alt="UC"> UC Yechish</a></li>
        <li><a href="#registration" class="nav-item"><img src="register-icon.png" alt="Register"> Ro'yxatdan O'tish</a></li>
      </ul>
    </nav>

    <section id="game" class="section">
      <h2>O'yinlar</h2>
      <button class="game-btn" onclick="startGame()">O'yinni Boshlash</button>
    </section>

    <section id="keys" class="section">
      <h2>Keyslar</h2>
      <button class="keys-btn" onclick="openKey(325)">325 UC (40%)</button>
      <button class="keys-btn" onclick="openKey(720)">720 UC (30%)</button>
      <button class="keys-btn" onclick="openKey(1920)">1920 UC (20%)</button>
      <button class="keys-btn" onclick="openKey(3250)">3250 UC (10%)</button>
    </section>

    <section id="uc-withdraw" class="section">
      <h2>UC Yechish</h2>
      <form id="uc-form">
        <input type="number" id="ucAmount" placeholder="UC miqdorini kiriting" required>
        <input type="text" id="pubgId" placeholder="PUBG ID kiriting" required>
        <button type="submit" class="submit-btn">Yuborish</button>
      </form>
    </section>

    <section id="registration" class="section">
      <h2>Ro'yxatdan O'tish</h2>
      <form id="register-form">
        <input type="text" id="username" placeholder="Foydalanuvchi nomi" required>
        <input type="password" id="password" placeholder="Parol" required>
        <button type="submit" class="submit-btn">Ro'yxatdan O'tish</button>
      </form>
    </section>
  </div>
</body>
      </html>
